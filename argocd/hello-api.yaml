# Tells Argo CD: keep the hello-api namespace in sync with k8s/ on main.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-api
  namespace: argocd
  finalizers:
    # Deleting this Application also deletes the resources it deployed.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: hello-api
  source:
    repoURL: https://github.com/whyatb/gke-gitops-demo.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-api
  syncPolicy:
    automated:
      prune: true    # delete resources that were removed from Git
      selfHeal: true # undo manual changes made directly in the cluster
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
