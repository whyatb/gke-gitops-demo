# Argo CD renders this directory with Kustomize and applies the result.
# CI updates the `images` entry below after each successful build; that
# commit is what triggers a deployment.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hello-api

resources:
- namespace.yaml
- deployment.yaml
- service.yaml
- pdb.yaml
- networkpolicy.yaml

# Changing a value here rolls the pods: Kustomize appends a content hash to the
# ConfigMap name, so the Deployment's pod template changes too.
configMapGenerator:
- literals:
  - GREETING=Hello
  name: hello-api-config

images:
- name: hello-api
  newName: us-central1-docker.pkg.dev/acdtkgha/apps/hello-api
  newTag: initial
